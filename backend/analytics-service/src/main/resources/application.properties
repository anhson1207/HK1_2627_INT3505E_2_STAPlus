spring.application.name=analytics-service
server.port=8088

# PostgreSQL Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sales_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# RabbitMQ Event-Driven Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.lead.url=${LEAD_SERVICE_URL:http://localhost:8082}
services.customer.url=${CUSTOMER_SERVICE_URL:http://localhost:8083}
services.sales.url=${SALES_SERVICE_URL:http://localhost:8084}
services.support.url=${SUPPORT_SERVICE_URL:http://localhost:8085}
