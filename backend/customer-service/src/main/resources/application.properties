spring.application.name=customer-service

server.port=8083

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crm_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgre123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT - must use the same secret as auth-service and lead-service
jwt.secret=${JWT_SECRET:mySuperSecretKeyForCRMProject12345678901234567890}