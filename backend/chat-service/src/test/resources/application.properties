spring.datasource.url=jdbc:postgresql://localhost:5432/chat_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

jwt.secret=test-only-junit-jwt-secret-key-minimum-32-chars-long-crm-2026
app.internal-key=test-only-junit-internal-service-key-min-16-chars
services.auth-service.url=http://localhost:8081
app.chat.ws.ticket-ttl-seconds=60
app.chat.upload-dir=uploads/chat

