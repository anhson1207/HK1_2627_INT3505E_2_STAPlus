spring.application.name=chat-service
server.port=${PORT:8086}

# =========================
# DATASOURCE (chat_db)
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chat_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =========================
# FLYWAY MIGRATION
# =========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# =========================
# JWT AUTHENTICATION
# =========================
jwt.secret=${JWT_SECRET}

# =========================
# INTERNAL INTER-SERVICE
# =========================
services.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
app.internal-key=${INTERNAL_SERVICE_KEY}
app.chat.ws.ticket-ttl-seconds=${CHAT_WS_TICKET_TTL:60}

# =========================
# CHAT MULTIPART & STORAGE
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.chat.upload-dir=${CHAT_UPLOAD_DIR:uploads/chat}

# =========================
# LOGGING
# =========================
logging.level.chat_service=INFO
logging.level.org.springframework.web.socket=INFO

